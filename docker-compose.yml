services:
  postgres:
    image: postgres:17-alpine
    container_name: mafia-noir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mafia}
      POSTGRES_USER: ${POSTGRES_USER:-mafia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - mafia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mafia-bot:
    build: .
    container_name: mafia-noir-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mafia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mafia}
      DATABASE_SSL: "false"
      HEALTH_PORT: "3000"
      ASSETS_DIR: /app/assets
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mafia_postgres_data:
